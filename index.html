<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grand Line</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="page">
        <header class="topbar">
            <div class="tabs">
                <button class="tab active" data-view="home">Home</button>
                <button class="tab" data-view="projects">Projects</button>

                <button class="add-tab" id="addProject" title="Add project">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                        <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" />
                    </svg>
                </button>
            </div>

            <form class="search-shell" id="searchForm">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="10.8" cy="10.8" r="6.5" stroke="currentColor" stroke-width="1.8" />
                    <path d="m16 16 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>

                <input id="searchInput" class="search-input" type="text" placeholder="Search..." autocomplete="off"
                    autofocus />

                <button class="engine" type="button" id="engineButton" title="Search with Google">
                    <span class="google-g">G</span>
                </button>
            </form>

            <div class="status-bar">
                <div class="status-item">
                    <span class="status-label">Local</span>
                    <span class="status-value" id="locationText">Home</span>
                </div>

                <div class="status-item">
                    <span class="status-label">Focus Today</span>
                    <span class="status-value" id="focusValue">0m</span>
                </div>

                <div class="status-item time">
                    <span class="status-label" id="dayLabel">Sun, Oct 4</span>
                    <span class="status-value" id="timeValue">--:--</span>
                </div>
            </div>
        </header>

        <main class="content">
            <section class="boards" id="homeView">
                <div class="board-grid" id="boardGrid"></div>
            </section>

            <section class="project-view" id="projectsView">
                <div class="panel">
                    <h2>Projects</h2>
                    <div class="project-list" id="projectList"></div>
                </div>
            </section>

            <aside class="side">
                <section class="panel calendar">
                    <div class="calendar-head">
                        <div class="calendar-title" id="monthTitle">October 2026</div>
                        <div class="month-switch">
                            <button class="month-btn" id="prevMonth" title="Previous month">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
                                    <path d="m14 6-6 6 6 6" stroke="currentColor" stroke-width="1.8"
                                        stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </button>
                            <button class="month-btn" id="nextMonth" title="Next month">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
                                    <path d="m10 6 6 6-6 6" stroke="currentColor" stroke-width="1.8"
                                        stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="weekdays">
                        <span>Su</span>
                        <span>Mo</span>
                        <span>Tu</span>
                        <span>We</span>
                        <span>Th</span>
                        <span>Fr</span>
                        <span>Sa</span>
                    </div>

                    <div class="days" id="calendarDays"></div>
                </section>

                <section class="panel pomodoro">
                    <div class="pomodoro-tabs">
                        <button class="pomo-tab active" data-minutes="25">Focus</button>
                        <button class="pomo-tab" data-minutes="5">Short Break</button>
                        <button class="pomo-tab" data-minutes="15">Long Break</button>
                    </div>

                    <div class="timer" id="timer">25:00</div>

                    <div class="dots" id="dots">
                        <span class="dot active"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>

                    <div class="pomo-actions">
                        <button class="circle-btn" id="resetTimer" title="Reset">
                            <svg viewBox="0 0 24 24" width="19" height="19" fill="none">
                                <path d="M4 12a8 8 0 1 0 2.2-5.5" stroke="currentColor" stroke-width="1.8"
                                    stroke-linecap="round" />
                                <path d="M4 5.5v4.1h4.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>

                        <button class="circle-btn primary" id="startTimer" title="Start">
                            <svg id="playIcon" viewBox="0 0 24 24" width="20" height="20" fill="none">
                                <path d="M9 6.5 17 12l-8 5.5V6.5Z" fill="currentColor" />
                            </svg>
                            <svg id="pauseIcon" viewBox="0 0 24 24" width="20" height="20" fill="none"
                                style="display:none">
                                <path d="M8 6v12M16 6v12" stroke="currentColor" stroke-width="2.2"
                                    stroke-linecap="round" />
                            </svg>
                        </button>

                        <button class="circle-btn" id="skipTimer" title="Skip">
                            <svg viewBox="0 0 24 24" width="19" height="19" fill="none">
                                <path d="m7 6 7 6-7 6V6Z" fill="currentColor" />
                                <path d="M17 6v12" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
                            </svg>
                        </button>
                    </div>
                </section>
            </aside>
        </main>
    </div>

    <div class="bottom-right">
        <button class="mini-icon" title="Menu" id="menuButton">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none">
                <path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
        </button>

        <button class="mini-icon" title="Settings" id="settingsButton">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none">
                <path d="M12 8.4a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2Z" stroke="currentColor" stroke-width="1.7" />
                <path
                    d="m19.2 13.2 1.1 1-.9 1.5-1.4-.4a7.1 7.1 0 0 1-1.6 1l-.2 1.5h-1.8l-.4-1.4a7.1 7.1 0 0 1-1.9 0l-.4 1.4H10l-.2-1.5a7.1 7.1 0 0 1-1.6-1l-1.4.4-.9-1.5 1.1-1a6.2 6.2 0 0 1 0-2.4l-1.1-1 .9-1.5 1.4.4a7.1 7.1 0 0 1 1.6-1L10 6.2h1.8l.4 1.4a7.1 7.1 0 0 1 1.9 0l.4-1.4h1.8l.2 1.5a7.1 7.1 0 0 1 1.6 1l1.4-.4.9 1.5-1.1 1a6.2 6.2 0 0 1 0 2.4Z"
                    stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" />
            </svg>
        </button>
    </div>

    <script src="state.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
